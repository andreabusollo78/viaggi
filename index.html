];
let baseLayer=null,baseIndex=0,switchingBase=false;
function loadBase(i){
 baseIndex=i;if(baseLayer){try{map.removeLayer(baseLayer)}catch(e){}}
 let errors=0;const b=basemaps[i];baseLayer=L.tileLayer(b.url,b.opt);
 baseLayer.on("tileerror",()=>{errors++;if(errors>=4&&!switchingBase&&baseIndex<basemaps.length-1){switchingBase=true;setTimeout(()=>{switchingBase=false;loadBase(baseIndex+1)},100)}});
 baseLayer.addTo(map);
}

const tags={
  fuel:'node["amenity"="fuel"]',
  atm:'node["amenity"="atm"]',
  restaurant:'nwr["amenity"~"restaurant|fast_food|cafe"]',
  parking:'nwr["amenity"="parking"]'
};
const labels={fuel:"Distributore",atm:"ATM",restaurant:"Ristorante / bar",parking:"Parcheggio"};


async function findServices(kind){
  if(!map) return;
  const btn=document.querySelector(`#menu button[data-kind="${kind}"]`);

  // Each category is independent: second click removes only that category.
  if(activeServices.has(kind)){
    if(serviceLayers[kind]){
      map.removeLayer(serviceLayers[kind]);
      delete serviceLayers[kind];
    }
    activeServices.delete(kind);
    btn?.classList.remove("active");
    $("#serviceStatus").textContent=activeServices.size
      ? "Attivi: "+[...activeServices].map(k=>labels[k]).join(", ")
      : "Nessun servizio attivo.";
    return;
  }

  btn?.classList.add("active");
  $("#serviceStatus").textContent="Ricerca "+labels[kind].toLowerCase()+"…";

  const c=map.getCenter();
  const radius=kind==="fuel"?12000:5000;
  const query=`[out:json][timeout:20];${tags[kind]}(around:${radius},${c.lat},${c.lng});out center 40;`;
  const endpoints=[
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter"
  ];

  let data=null;
  for(const ep of endpoints){
    try{
      const url=ep+"?data="+encodeURIComponent(query);
      const r=await fetch(url,{method:"GET",headers:{"Accept":"application/json"}});
      if(!r.ok) throw new Error("HTTP "+r.status);
      data=await r.json();
      break;
    }catch(e){}
  }

  if(!data){
    btn?.classList.remove("active");
    $("#serviceStatus").textContent="Ricerca "+labels[kind].toLowerCase()+" temporaneamente non disponibile.";
    return;
  }

  const layer=L.layerGroup().addTo(map);
  serviceLayers[kind]=layer;
  activeServices.add(kind);

  const styles={
    fuel:{color:"#fff",fillColor:"#e11d48"},
    atm:{color:"#fff",fillColor:"#7c3aed"},
    restaurant:{color:"#fff",fillColor:"#ea580c"},
    parking:{color:"#fff",fillColor:"#2563eb"}
  };

  let count=0;
  data.elements.forEach(x=>{
    const lat=x.lat??x.center?.lat, lng=x.lon??x.center?.lon;
    if(lat==null||lng==null) return;
    const name=x.tags?.name||labels[kind];
    const nav=`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
    const st=styles[kind];
    const m=L.circleMarker([lat,lng],{
      radius:8,weight:2,color:st.color,fillColor:st.fillColor,fillOpacity:.95
    }).addTo(layer);
    m.bindPopup(`<b>${name}</b><br>${labels[kind]}<br><a href="${nav}" target="_blank" rel="noopener">Naviga</a>`);
    count++;
  });

  $("#serviceStatus").textContent=count
    ? "Attivi: "+[...activeServices].map(k=>labels[k]).join(", ")
    : "Nessun risultato per "+labels[kind].toLowerCase()+".";
}
document.querySelectorAll("#menu button[data-kind]").forEach(b=>{
  b.addEventListener("click",ev=>{
    ev.preventDefault();
    ev.stopPropagation();
    findServices(b.dataset.kind);
  });
});
